<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 방 프로토타입 · 독서 공유방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e5da;--card:#fffaf0;--ink:#3b3226;--muted:#8a7d6a;--line:#ddd2bd;--accent:#4f7a5a;--warm:#d9895a;--danger:#b5453a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
button:hover{background:#f6eedd}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#436a4d}
button.ghost{border-color:transparent;background:transparent}
input,textarea{font:inherit;color:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{resize:vertical;min-height:70px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
.app{max-width:1180px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.avatar-dot{width:40px;height:40px;border-radius:50%;background:#e4efe2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.who{flex:1;min-width:0}
.who b{font-size:16px}
.who small{display:block;color:var(--muted);font-size:13px}
.reset{font-size:12px;color:var(--muted);padding:6px 10px}
.main{margin-top:14px}
.stage-wrap{flex:1;min-width:0;position:relative;background:radial-gradient(ellipse at 50% 58%,#fbf3e2 0%,#ecdcbc 78%);border:4px solid #8a5f3a;border-radius:18px;overflow:hidden}
#stage{display:block;width:100%;height:min(calc(100vh - 120px),720px);min-height:420px;touch-action:manipulation}
.ov{position:absolute;pointer-events:none;z-index:2;transform:translate(-50%,-100%)}
#nameTag{font-size:12px;background:rgba(255,250,240,.92);padding:1px 8px;border-radius:6px;color:#3b3226;white-space:nowrap}
#lampLabel{background:#3b3226;color:#fff;font-size:12px;padding:1px 8px;border-radius:7px;white-space:nowrap}
#lampLabel.warn{background:#b5453a}
#newMark,#newMarkWin,#newMarkSofa{color:#e0a43a;font-size:20px;transform:translate(-50%,-50%);animation:tw 1.2s ease-in-out infinite}
.fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
.hint{position:absolute;left:14px;top:12px;font-size:13px;color:var(--muted);background:rgba(255,250,240,.85);padding:4px 10px;border-radius:999px}
.coach{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:3}
.notice{top:auto;bottom:14px;background:#5a4a2e}
.coach button{white-space:nowrap;flex:none;padding:4px 10px;font-size:13px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:50;display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(40,30,20,.28);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.backdrop.open{display:flex;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
aside.panel{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:min(84vh,720px);overflow:auto;box-shadow:0 18px 50px rgba(40,30,20,.25);animation:pop .18s ease}
.foot{position:sticky;bottom:0;background:var(--card);padding:10px 16px 16px;margin-left:-16px;margin-right:-16px;z-index:5;box-shadow:0 -10px 12px -10px rgba(40,30,20,.18)}
.panel-head{position:sticky;top:0;background:var(--card);padding:16px 16px 6px;margin:0 -16px;z-index:5}
aside.panel{padding-top:0!important;padding-bottom:0!important}
aside.panel::after{content:'';display:block;height:16px}
aside.panel.wide{width:min(780px,100%)}
.mir{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.mir-l{display:flex;flex-direction:column;gap:10px;position:sticky;top:64px}
.mir-pv{background:#eef4f3;border-radius:14px;display:flex;align-items:center;justify-content:center;height:320px}
.mir-pv img{height:300px;width:auto}
select{font:inherit;color:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
#stage{transition:opacity .25s}
.stage-wrap.fading #stage{opacity:0}
.vlab{background:rgba(255,250,240,.94);padding:2px 8px;border-radius:8px;font-size:11.5px;color:#3b3226;text-align:center;line-height:1.3;white-space:nowrap}
.vlab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:#b9b2a2}
.vlab .dot.open{background:#e8764a}.vlab .dot.closed{background:#7aa7e0}
.stage-wrap.vil .hint{max-width:calc(100% - 150px);border-radius:14px;line-height:1.4}  /* 마을: 오른쪽 위 미니맵과 윗선을 맞추고 겹치지 않게 줄바꿈 */
#online{display:none;position:absolute;right:14px;bottom:8px;z-index:2;pointer-events:none;font-size:11px;color:var(--muted);opacity:.7}  /* 정보성 안내: 눈에 띄지 않게 하단에 연하게 */
.stage-wrap.vil #online{display:block}
#minimap{display:none;position:absolute;top:12px;right:12px;width:112px;height:112px;z-index:3;pointer-events:auto;cursor:default;background:rgba(255,250,240,.88);border:1px solid #d9cfb8;border-radius:10px;box-shadow:0 2px 6px rgba(60,40,20,.15)}
.stage-wrap.vil #minimap{display:block}
.panel-head h2:focus{outline:none}
.vbub{z-index:3;background:#fff;border:1px solid #d9cfb8;padding:4px 9px;border-radius:12px;font-size:12px;line-height:1.35;width:max-content;max-width:150px;overflow-wrap:anywhere;color:#3b3226;text-align:center;box-shadow:0 2px 6px rgba(60,40,20,.18)}
.vbub.me{background:#fff4c9;border-color:#e8c96a}
.plog{max-height:46vh;overflow-y:auto;margin:8px 0}
/* 공유방 대화 (RC) */
.rsub{font-size:13px;color:var(--muted);margin:0 0 6px}
.rtabs{margin:6px 0 8px}
.rlog{position:relative;max-height:min(38vh,330px);min-height:110px;overflow-y:auto;margin:6px 0}
.rd{text-align:center;font-size:11px;color:var(--muted);margin:10px 0 6px}
.rnew{text-align:center;font-size:12px;color:#8a5a00;border-top:1px solid #e8c96a;margin:10px 0 6px;padding-top:3px}
.rm{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin:6px 26px 6px 0;overflow-wrap:anywhere}
.rm.me{background:#fff4c9;border-color:#e8c96a;margin:6px 0 6px 26px}
.rm.del{background:none;border-style:dashed;color:var(--muted);font-size:13px}
.rm-h{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.rm-h i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.rm-h b{font-weight:normal;color:var(--ink)}
.rm-h small{font-size:10px;background:#eee8dc;border-radius:999px;padding:0 6px}
.rm-h .pg{background:#e4efe2;color:#2f5a3a;border-radius:999px;padding:0 7px;font-size:11px}
.rm-h time{margin-left:auto}
.rm-x{border:0;background:none;padding:0 4px;color:var(--muted);min-height:0}
.rm-t{font-size:14px;margin-top:3px;white-space:pre-wrap}
.rm.lk .rm-t{filter:blur(4px);user-select:none;color:#8a7d68}
.rm .lkcap{font-size:12px;color:#8a5a00;margin-top:2px}
.rlockinfo{font-size:12px;color:#8a5a00;background:#fff4c9;border-radius:8px;padding:4px 8px;margin-bottom:6px}
.rband{display:flex;gap:10px;align-items:center;background:#fbe7d6;border-radius:12px;padding:8px 10px;margin:6px 0}
.rband.hot{background:#f9d3c4}
#goal::-webkit-outer-spin-button,#goal::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}   /* 목표 입력칸의 위아래 버튼은 없애고 [−] [+]만 둔다 */
#goal{-moz-appearance:textfield;appearance:textfield}
.reset.armed{color:var(--danger);border-color:var(--danger)}
/* 마을 광장 대화창: 모달이 아니라 마을 화면 위에 뜨는 반투명 채팅창. 광장 안에 서 있을 때만 자동으로 뜬다 (결정 #40) */
#plazaChat{display:none;position:absolute;z-index:4;left:12px;top:12px;bottom:12px;width:300px;flex-direction:column;overflow:hidden;   /* PC: 배경(마을 화면) 높이에 맞춰 왼쪽에 세로로 길게. 글 수와 상관없이 크기 고정 */
 background:rgba(255,250,240,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border:1px solid rgba(217,207,184,.9);border-radius:14px;box-shadow:0 4px 14px rgba(60,40,20,.18);color:var(--ink);font-size:13px}
.stage-wrap.pz #plazaChat{display:flex}
.stage-wrap.pz #online{display:none}
#pzHead{border:0;background:none;display:flex;gap:6px;align-items:center;width:100%;padding:7px 10px;font-size:12px;color:var(--muted);text-align:left;min-height:0}
#pzLog{flex:1;min-height:0;overflow-y:auto;padding:0 6px 2px 10px}   /* 스크롤바: 얇고 연한 둥근 막대, 화살표·바탕 없음 (크롬·엣지·사파리는 아래 ::-webkit-scrollbar, 파이어폭스는 @supports) */
@supports not selector(::-webkit-scrollbar){#pzLog{scrollbar-width:thin;scrollbar-color:rgba(138,125,106,.42) transparent}}
#pzLog::-webkit-scrollbar{width:6px}
#pzLog::-webkit-scrollbar-track{background:transparent}
#pzLog::-webkit-scrollbar-thumb{background:rgba(138,125,106,.42);border-radius:999px}
#pzLog::-webkit-scrollbar-thumb:hover{background:rgba(138,125,106,.7)}
#pzLog::-webkit-scrollbar-button{display:none;width:0;height:0}
#pzLog .msg{font-size:13px;margin:3px 0;overflow-wrap:anywhere}
#pzLog .msg i{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px}
#pzLog .msg.me{text-align:right}
#pzForm{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px 8px}
#pzForm input{flex:1;min-width:0;background:rgba(255,255,255,.88)}
#pzForm #pzE{width:100%;min-height:0}
#plazaChat.min #pzLog,#plazaChat.min #pzForm{display:none}
#plazaChat.min{top:auto;height:auto}
@media (max-width:760px){#plazaChat{left:0;right:0;top:auto;width:auto;height:230px;bottom:var(--kb,0px);max-height:55%;border-radius:14px 14px 0 0;border-width:1px 0 0 0}#plazaChat.min{height:auto}}
.rchip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:#fff;font-size:13px;min-height:0}
.vstar{color:#e0a100}
.plog .msg{overflow-wrap:anywhere}.plog .msg.me{text-align:right}.plog .msg i{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px}
.stage-wrap.vil #newMark,.stage-wrap.vil #newMarkWin,.stage-wrap.vil #newMarkSofa,.stage-wrap.vil #lampLabel{display:none!important}
.bthumb{width:48px;height:68px;border-radius:6px;overflow:hidden;flex:none;box-shadow:0 1px 3px rgba(40,30,20,.25)}
.bthumb img{width:100%;height:100%;object-fit:cover;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-weight:normal;color:var(--muted);font-size:12px}
.cal i{font-style:normal;display:flex;flex-direction:column;align-items:center;justify-content:center;height:38px;border-radius:10px;font-size:14px}
.cal i.on{background:#e4efe2}
.cal i.on::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.cal i.today{box-shadow:0 0 0 2px var(--ink)}
.shuffle{width:48px;height:48px;padding:0;border-radius:50%;align-self:center;display:flex;align-items:center;justify-content:center}
.mir-r .opt{margin-bottom:16px}.mir-r .opt:last-child{margin-bottom:0}
.mir-r .opt label{margin:0 0 8px}
.mir-r .row.wrap{gap:8px}
@media (max-width:640px){.mir{grid-template-columns:1fr;gap:16px}.mir-l{position:static}.mir-pv{height:210px}.mir-pv img{height:190px}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.panel-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.panel-head h2{flex:1;margin:0;font-size:19px;font-weight:normal}
.handle{display:none}
.firsttip{font-size:13px;background:#f3ead4;border-radius:10px;padding:8px 10px;margin:6px 0 10px;color:#6b5b3e}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin:8px 0}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px;margin-top:4px;min-height:1px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1;padding:7px}
.seg button.on{background:var(--ink);color:#fff}
.note{border-left:3px solid var(--accent);padding:6px 10px;margin:8px 0;background:#fbf7ee;border-radius:0 8px 8px 0;font-size:14px}
.note.q{border-color:var(--warm);font-style:italic}
.note .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px;font-style:normal}
.stars button{border:0;background:transparent;font-size:24px;padding:0 2px;color:#d6c9ad}
.stars button.on{color:#e0a43a}
.book{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px;margin:7px 0;background:#fff;width:100%;text-align:left}
.spine{width:12px;height:42px;border-radius:3px;flex:none}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{padding:6px 12px;border-radius:999px;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:#e4efe2;color:#2f5a3a}
.badge.warn{background:#fbe7d6;color:#9a4b1c}
.badge.gray{background:#eee8dc;color:#6b5f4c}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.preset{padding:6px 10px;font-size:13px}
.preset.on{background:var(--ink);color:#fff}
.acc{font-size:13px;padding:6px 10px}
.acc.on{background:var(--ink);color:#fff}
.acc[disabled]{opacity:.5;cursor:not-allowed}
.progress{height:8px;background:#eee4cf;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.msg{font-size:14px;margin:6px 0}
.msg b{font-weight:normal;color:var(--muted);font-size:12px;margin-right:6px}
.sr-btns button{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
.furn{cursor:pointer}
.furn .hull{fill:transparent;stroke:transparent;stroke-width:4;stroke-linejoin:round}
.furn.hl .hull{stroke:#fff6d8}
.furn.hl .shape{filter:brightness(1.06)}
@media (hover:hover){.furn:hover .hull{stroke:#fff6d8}.furn:hover .shape{filter:brightness(1.06)}}
input[type=range]{accent-color:var(--accent)}
.home-f{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:6px 0;padding:9px 10px}
.home-f i{font-style:normal;width:22px;text-align:center}
.furn.dim{opacity:.35}
.pulse{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.flash{animation:fl .5s ease 2}
@keyframes fl{50%{filter:brightness(1.35)}}
.spark{animation:tw 1.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
@media (max-width:760px){
 /* 폰: 여백 없이 화면을 가득 채운다. 헤더는 얇은 띠, 방·마을 화면이 나머지 전체 */
 .app{padding:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
 header.top{border-radius:0;border-width:0 0 1px 0;padding:6px 12px;flex:none}
 .main{display:block;margin-top:0;flex:1;min-height:0}
 .stage-wrap{height:100%;border:0;border-radius:0}
 #stage{height:100%;min-height:0}
 .coach{width:calc(100% - 24px);justify-content:space-between}
 .toast{max-width:90%;text-align:center}
 .who small{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}  /* 별 점멸·모달·토스트 연출을 끈다. 걷기 같은 기능 이동은 JS라 그대로 */
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="avatar-dot" id="hdrAvatar" aria-hidden="true"></div>
  <div class="who"><b id="hdrName">조약돌의 방</b><small id="hdrStats"></small></div>
  <button class="reset" id="resetBtn">데모 초기화</button>
 </header>
 <div class="main">
  <div class="stage-wrap" id="stageWrap">
   <canvas id="stage" role="img" aria-label="내 방"></canvas>
   <div class="ov" id="nameTag"></div><div class="ov" id="lampLabel" style="display:none"></div><div class="ov" id="newMark" style="display:none">✦</div><div class="ov" id="newMarkWin" style="display:none">✦</div><div class="ov" id="newMarkSofa" style="display:none">✦</div>
   <div class="fail" id="fail">이 브라우저에서는 3D를 그릴 수 없어요. 크롬이나 엣지에서 열어 주세요.</div>
   <div class="hint" id="hint">가구를 눌러 사용 · 바닥을 눌러 이동</div>
   <canvas id="minimap" width="224" height="224" aria-hidden="true"></canvas>
   <div id="online" aria-hidden="true"></div>
   <div id="plazaChat" role="region" aria-label="마을 광장 대화"><button id="pzHead" type="button"></button><div id="pzLog" aria-live="polite"></div><div id="pzForm"><input id="pz" maxlength="40" placeholder="한 줄로 말해요" autocomplete="off" enterkeyhint="send"><button class="primary" id="pzSend" type="button" style="white-space:nowrap">보내기</button><div class="muted" id="pzE"></div></div></div>
   <div class="coach" id="coach" style="display:none"></div>
   <div class="coach notice" id="notice" style="display:none"></div>
   <div class="sr-btns" id="srBtns"></div>
  </div>
  
 </div>
</div>
<div class="backdrop" id="backdrop"><aside class="panel" id="panel" role="dialog" aria-modal="true" aria-live="polite"></aside></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script src="vendor/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"><\/script>')</script>
<script>
let TW=32,TZ=32;const TH=16;
const P=(x,y,z)=>[(x-y)*TW,(x+y)*TH-z*TZ];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.min(255,Math.round(r*f));g=Math.min(255,Math.round(g*f));b=Math.min(255,Math.round(b*f));return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function box(x,y,z,w,d,h,c,cls){

// 책 검색: 제목·저자·ISBN, 또는 ISBN이 들어 있는 책 링크. 인터넷이 없으면 직접 입력한다.
async function searchBooks(q){
 q=q.trim();if(!q)return {err:'검색어를 적어 주세요'};
 let query=q;
 if(/^https?:\/\//i.test(q)){const m=q.match(/97[89]\d{10}|(?<!\d)\d{9}[\dXx](?!\d)/);if(!m)return {err:'이 링크에서 책을 찾지 못했어요. 제목으로 찾아 보세요'};query='isbn:'+m[0]}
 else if(/^[\d\s-]{10,17}$/.test(q))query='isbn:'+q.replace(/[-\s]/g,'');
 const get=async url=>{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);try{const res=await fetch(url,{signal:ctl.signal});if(!res.ok)throw new Error('http '+res.status);return await res.json()}finally{clearTimeout(tm)}};
 // 1순위: 구글 북스 (키 없이 쓰면 공용 한도가 금방 차서 자주 실패한다. BOOK_API_KEY에 키를 넣으면 안정적)
 const viaGoogle=async()=>{const j=await get('https://www.googleapis.com/books/v1/volumes?maxResults=6&printType=books&q='+encodeURIComponent(query)+(BOOK_API_KEY?'&key='+BOOK_API_KEY:''));
  return (j.items||[]).map(it=>{const v=it.volumeInfo||{},ids=v.industryIdentifiers||[];
   return {title:v.title||'',author:(v.authors||[]).join(', '),pages:v.pageCount||0,isbn:(ids.find(x=>x.type==='ISBN_13')||ids[0]||{}).identifier||'',cover:((v.imageLinks||{}).thumbnail||'').replace(/^http:/,'https:').replace('&edge=curl','')}}).filter(x=>x.title)};
 // 2순위: Open Library (키 없음. ISBN으로는 잘 찾고, 한국어 제목 검색은 약하다)
 const viaOpenLibrary=async()=>{const j=await get('https://openlibrary.org/search.json?limit=6&fields=title,author_name,number_of_pages_median,isbn,cover_i&q='+encodeURIComponent(query));
  return (j.docs||[]).map(d=>({title:d.title||'',author:(d.author_name||[]).join(', '),pages:d.number_of_pages_median||0,isbn:(d.isbn||[]).find(x=>x.length===13)||(d.isbn||[])[0]||'',cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':''})).filter(x=>x.title)};
 let items=[],failed=0;
 for(const f of [viaGoogle,viaOpenLibrary]){try{items=await f();if(items.length)break}catch(e){failed++}}
 if(items.length)return {items};
 if(failed===2)return {err:navigator.onLine?'책 정보를 가져오지 못했어요. 아래에 직접 적어 주세요':'인터넷에 연결되어 있지 않아요. 아래에 직접 적어 주세요'};
 return {items:[]};
}

const rcKey=s=>String(s||'').replace(/[『』\s]/g,'');

const rcName=m=>m.left?'나간 참여자':m.who==='나'?S.user.nickname:m.who;
const rcHash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};

function myPos(n){const b=rcKey(roomBook(n));
 if([...S.finished,...S.dropped].some(x=>rcKey(x.title)===b))return {all:true};
 if(S.reading&&rcKey(S.reading.title)===b)return {page:S.reading.page>0?S.reading.page:null};

// 쪽수 잠금 (RC-06): 내 쪽보다 뒤쪽 글, 내 쪽수를 안 적었으면 쪽수가 붙은 글 모두. 잠긴 글은 내용을 화면에 아예 싣지 않는다
function rcLocked(n,m){if(n.rtype==='OWN'||n.pageLock===false||m.del||rcMine(m)||m.page==null)return false;const p=myPos(n);return !p.all&&(p.page==null||m.page>p.page)}

const rcMembersOf=(n,c)=>{const o=rcHash(n.id)%NAMEPOOL.length;return Array.from({length:Math.max(0,Math.min(c,NAMEPOOL.length))},(_,i)=>NAMEPOOL[(o+i)%NAMEPOOL.length])};
// 옛 형식 방을 대화용 필드로 보정하고, 열린 남의 방에는 시연용 글을 몇 개 깔아 둔다

 if(!n.rtype)n.rtype='SAME';if(n.pageLock===undefined)n.pageLock=n.rtype==='SAME';

 if(n.lastRead===undefined)n.lastRead=0;
 if(n.kind==='OPEN'&&!n.mine&&!n.seeded&&!n.messages.length&&n.members.length){n.seeded=true;
  [12,34,52,88,121,160,205,260].forEach((pg,i)=>n.messages.push({id:'m'+n.id+'s'+i,who:n.members[i%n.members.length],text:ROOM_SAY[i%ROOM_SAY.length],page:n.rtype==='OWN'?null:pg,ts:Date.now()-(8-i)*4*3600e3}))}

function minOfBook(id){return S.sessions.filter(x=>x.bookId===id).reduce((a,x)=>a+x.minutes,0)}
const fmtMin=m=>m>=60?Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':''):m+'분';
function todayMin(){const k=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}),t=k(Date.now());return S.sessions.filter(x=>k(x.endedAt||x.startedAt)===t).reduce((a,x)=>a+x.minutes,0)} // 달력과 같은 기준: 한국 시간, 종료일에 세션 전체를 센다
function startTimer(){
 if(!S.reading||S.session)return;
 const now=Date.now();S.session={id:now,bookId:S.reading.id,startedAt:now,lastCheckAt:now,status:'RUNNING'};save();
 panelView={};render();renderPanel();toast('스탠드를 켰어요. 읽기 시작!');
 if(notifyState()==='ask')askNotify();
 if(!isSit())walkTo(...TARGET.sofa,sitDown);
}
function endSession(end,by,quiet){
 if(S.session&&S.session.status==='NEEDS_CONFIRM'&&by!=='CONFIRM')end=S.session.lastCheckAt; // 확인 전에는 마지막으로 확인한 시각까지만 기록한다
 if(pipWin){const mm=S.session?Math.floor((end-S.session.startedAt)/60000):0;pipDone(mm);}
 const ses=S.session;if(!ses)return;const min=Math.floor((end-ses.startedAt)/60000);S.session=null;  // 1분 미만(59초까지)은 기록하지 않는다
 if(min<1){if(!quiet)toast('1분 미만은 기록하지 않아요')}
 else{S.sessions.push({id:ses.id,bookId:ses.bookId,startedAt:ses.startedAt,endedAt:end,minutes:min,source:'TIMER',endedBy:by});if(!quiet)toast(min+'분 읽었어요. 스탠드를 껐어요')}
 save();panelView={};render();renderPanel();
}
function checkSession(force){
 const ses=S.session;if(!ses)return;
 if(ses.status==='RUNNING'&&Date.now()-ses.startedAt>CAP){ses.status='NEEDS_CONFIRM';save();render();if(panelOpen==='lamp')renderPanel();return}
 if(force){render();if(panelOpen==='lamp'||!panelOpen)renderPanel()}
}
// 브라우저 알림: 이 페이지를 열어 둔 동안 온다. 창을 닫은 뒤에도 받으려면 서버 푸시가 필요하다 (DATA_API.md).
function notifyState(){if(!('Notification' in window))return 'none';return Notification.permission==='granted'?'on':Notification.permission==='denied'?'off':'ask'}
function askNotify(){if(!('Notification' in window))return Promise.resolve();return Promise.resolve(Notification.requestPermission()).then(()=>{if(panelOpen)renderPanel()})}
function notify(title,body,tag,onclick){
 if(notifyState()==='on'){try{const n=new Notification(title,{body,tag,icon:G3?G3.snap(S.avatar,'head'):undefined});n.onclick=()=>{window.focus();n.close();if(onclick)onclick()};return}catch(e){}}
 toast(title+' · '+body); // 알림을 못 보낼 때는 화면 안내로 대신한다
}
function notifyRow(){
 const st=notifyState();
 if(st==='ask')return `<div class="row" style="margin-top:8px"><span class="muted grow">60분마다 읽고 있는지 알림으로 물어봐요</span><button data-act="askNotify">알림 켜기</button></div>`;
 if(st==='on')return '<p class="muted">알림이 켜져 있어요. 60분마다 읽고 있는지 물어봐요. 이 페이지를 열어 둘 때 와요.</p>';
 if(st==='off')return '<p class="muted">브라우저에서 알림이 꺼져 있어요. 주소창 옆 자물쇠에서 알림을 허용해 주세요.</p>';
 return '<p class="muted">이 브라우저는 알림을 지원하지 않아요. 화면의 안내로만 알려드려요.</p>';
}
function fireDue(){
 const ses=S.session;
 if(ses){
  if(ses.status==='NEEDS_CONFIRM'&&!ses.notifiedConfirm){ses.notifiedConfirm=true;save();notify('확인이 필요해요',fmtClock(ses.startedAt)+'에 켠 스탠드가 아직 켜져 있어요. 언제까지 읽었는지 알려 주세요.','confirm',()=>openF('lamp'))}
  else if(ses.status==='RUNNING'&&Date.now()-ses.lastCheckAt>=CHECK&&ses.notifiedAt!==ses.lastCheckAt){ses.notifiedAt=ses.lastCheckAt;save();notify('아직 읽고 있어요?',(S.reading?'『'+S.reading.title+'』을 ':'')+'읽은 지 60분이 지났어요. 계속 읽고 있나요?','check')}
 }
 // 종료 후 7일이 지난 공유방은 사라진다 (가져온 기록은 내 서재에 남는다)
 // 내가 만든 모닥불은 기간이 끝나면 종료되고, 그때부터 7일 보관된다
 S.news.forEach(n=>{if(n.mine&&n.kind==='OPEN'&&n.closesAt&&Date.now()>=n.closesAt){n.kind='CLOSED';n.deleteAt=Date.now()+7*DAY;save();render();if(panelOpen&&panelOpen!=='plaza')renderPanel()}});
 const nb=S.news.length;S.news=S.news.filter(n=>!(n.kind==='CLOSED'&&n.deleteAt&&Date.now()>=n.deleteAt));
 if(S.news.length!==nb){save();render();buildSr();if(panelOpen&&panelOpen!=='plaza')renderPanel()}
 S.news.forEach(n=>{if(n.kind==='SOON'&&n.opensAt&&Date.now()>=n.opensAt){
  n.kind='OPEN';n.sub='지금 열렸어요';
  if(n.alarm&&!n.notified){n.notified=true;notify('이야기방이 열렸어요',n.title,'room-'+n.id,()=>openF('window'))}
  save();render();if(panelOpen==='window')renderPanel()}});
}
function renderNotice(){
 const n=document.getElementById('notice');const ses=S.session;
 if(ses&&ses.status==='NEEDS_CONFIRM'){n.style.display='flex';n.innerHTML=`<span>${fmtClock(ses.startedAt)}에 켠 스탠드가 아직 켜져 있어요</span><button data-n="confirm">확인하기</button>`}
 else if(ses&&Date.now()-ses.lastCheckAt>=CHECK){n.style.display='flex';n.innerHTML=`<span>아직 읽고 있어요? <small style="opacity:.7">(알림 예시)</small></span><button data-n="cont">계속</button><button data-n="stop">스탠드 끄기</button>`}
 else n.style.display='none';
}
document.getElementById('notice').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;e.stopPropagation();
 if(b.dataset.n==='cont'){S.session.lastCheckAt=Date.now();save();render();toast('계속 기록할게요')}
 if(b.dataset.n==='stop'){openF('lamp');panelView={mode:'stop'};renderPanel()}
 if(b.dataset.n==='confirm'){openF('lamp')}
});
setInterval(()=>{if(!S.session)return;if(pipWin){const el=pipWin.document.getElementById('pt');if(el)el.textContent=fmtHMS(elapsed())}checkSession();if(S.session&&S.session.status==='RUNNING'){const t=fmtHMS(elapsed());const a=document.getElementById('lampTime');if(a)a.textContent=t;const big=document.getElementById('timerBig');if(big)big.textContent=t;const ht=document.getElementById('homeT');if(ht)ht.textContent=t;
 document.getElementById('hdrStats').textContent=hdrText(' · ⏱ '+t);
 const n=document.getElementById('notice');if(n.style.display==='none'&&Date.now()-S.session.lastCheckAt>=CHECK)renderNotice()}},1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkSession(true)});
addEventListener('pageshow',e=>{if(e.persisted)checkSession(true)}); // 모바일 뒤로가기 캐시 복귀
setInterval(fireDue,5000);
render();renderPanel();entryFlash();checkSession(true);
// 초대 링크(#join=코드)로 열면 그 모닥불로 들어간다
(function(){const m=/#join=([A-Za-z0-9]+)/.exec(location.hash);if(m){history.replaceState(null,'',location.href.split('#')[0]);setTimeout(()=>joinByCode(m[1]),700)}})();
</script>
