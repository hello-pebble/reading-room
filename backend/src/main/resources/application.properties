spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/readingroom}
spring.datasource.username=${DATABASE_USER:readingroom}
spring.datasource.password=${DATABASE_PASSWORD:readingroom}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.flyway.enabled=true
spring.jooq.sql-dialect=POSTGRES
app.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:}
app.nl.cert-key=${NL_CERT_KEY:}
# 카카오 책 검색 REST API 키. 제목 검색을 카카오가 먼저 맡는다. 비어 있으면 국립중앙도서관 제목 검색을 쓴다. 값은 환경변수로만 받는다
app.kakao.rest-key=${KAKAO_REST_KEY:}
# 구글 로그인: 구글 클라우드에서 만든 OAuth 클라이언트 ID. 비어 있으면 로그인은 503(AUTH_UNAVAILABLE). 값은 환경변수로만 받는다
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
# 게스트 로그인(가입 없이 시작)에서 IP당 한 시간에 새로 만들 수 있는 계정 수. 이미 있는 기기 키로 다시 들어오는 것은 세지 않는다
app.auth.guest-signups-per-hour-per-ip=${GUEST_SIGNUPS_PER_HOUR_PER_IP:30}
# 기기 이전 코드를 입력해 보는 횟수: IP당 10분에 이만큼(맞든 틀리든 코드 모양이 맞는 시도를 센다). 코드 맞추기를 막는다
app.auth.transfer-attempts-per-10min-per-ip=${TRANSFER_ATTEMPTS_PER_10MIN_PER_IP:10}
# 책 검색(GET /books/search, 로그인 없음) 호출 제한: IP당 1분에 이만큼. 넘으면 429 TOO_MANY_REQUESTS (결정 #88)
app.search.per-minute-per-ip=${SEARCH_PER_MINUTE_PER_IP:30}
# 프록시(nginx·로드밸런서) 뒤에서 실제 접속자 IP를 쓰려면 native 로 둔다(framework는 접속자 IP를 바꾸지 않는다)(게스트·이전 코드 IP 제한이 이 IP를 쓴다)
server.forward-headers-strategy=${FORWARD_HEADERS:none}
# 화면을 다른 주소에서 열 때만 그 주소들을 쉼표로 넣는다(예: http://localhost:8765). 비어 있으면 같은 주소(서버가 화면을 내는 배포)만 된다. 운영에서 null·* 는 넣지 않는다
app.cors.origins=${CORS_ORIGINS:}

# 화면 파일: 브라우저가 매번 최신인지 확인한다(바뀌지 않았으면 304). 배포하면 바로 새 화면이 쓰인다 (결정 #100)
spring.web.resources.cache.cachecontrol.no-cache=true
