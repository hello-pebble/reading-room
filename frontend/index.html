<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 방 프로토타입 · 독서 공유방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/room.css">
<link rel="stylesheet" href="css/village.css">
<link rel="stylesheet" href="css/shared-room.css">
<link rel="stylesheet" href="css/neighbor.css">
</head>
<body>
<div class="app">
 <header class="top">
  <div class="avatar-dot" id="hdrAvatar" aria-hidden="true"></div>
  <div class="who"><b id="hdrName">조약돌의 방</b><small id="hdrStats"></small></div>
  <div class="top-actions">
   <button class="reset" id="nickBtn" type="button" hidden>닉네임 바꾸기</button>
   <button class="reset" id="logoutBtn" type="button" hidden>로그아웃</button>
   <button class="reset" id="resetBtn">데모 초기화</button>
  </div>
 </header>
 <div class="main">
  <div class="stage-wrap" id="stageWrap">
   <canvas id="stage" role="img" aria-label="내 방"></canvas>
   <button class="neighbor-exit" id="neighborExit" type="button">← 마을로</button>
   <div class="ov" id="giftMark" style="display:none">✦</div>
   <div class="ov" id="nameTag"></div><div class="ov" id="lampLabel" style="display:none"></div><div class="ov" id="newMark" style="display:none">✦</div><div class="ov" id="newMarkWin" style="display:none">✦</div><div class="ov" id="newMarkSofa" style="display:none">✦</div>
   <div class="fail" id="fail">이 브라우저에서는 3D를 그릴 수 없어요. 크롬이나 엣지에서 열어 주세요.</div>
   <div class="hint" id="hint">가구를 눌러 사용 · 바닥을 눌러 이동</div>
   <div class="camp-top"><button class="camp-exit" id="campExit" type="button">← 마을로</button></div>
   <div class="camp-side" id="campSide"><button type="button" class="cs-people" data-camp="members" aria-label="참여자" title="참여자"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.2" cy="10" r="2.3" fill="#b9c7e8"/><path d="M1 19v-1.2a4.2 4.2 0 0 1 8.4 0V19z" fill="#b9c7e8"/><circle cx="18.8" cy="10" r="2.3" fill="#b9c7e8"/><path d="M14.6 19v-1.2a4.2 4.2 0 0 1 8.4 0V19z" fill="#b9c7e8"/><circle cx="12" cy="8" r="3.2" fill="#8aa0d6"/><path d="M6.5 20.5v-2a5.5 5.5 0 0 1 11 0v2z" fill="#8aa0d6"/></svg></button><button type="button" class="cs-info" data-camp="info" aria-label="방 정보" title="방 정보"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.4" fill="#f4bb42"/><circle cx="12" cy="7.7" r="1.5" fill="#7a4a14"/><rect x="10.7" y="10.6" width="2.6" height="7" rx="1.2" fill="#7a4a14"/></svg></button></div>
   <div class="cm-backdrop" id="campModal"><aside class="panel cm-panel" id="campModalPanel" role="dialog" aria-modal="true" aria-label="참여자 · 방 정보"></aside></div>
   <button class="camp-chat-toggle" id="campChatToggle" type="button"></button>
   <canvas id="minimap" width="224" height="224" aria-hidden="true"></canvas>
   <div id="online" aria-hidden="true"></div>
   <div id="plazaChat" role="region" aria-label="마을 광장 대화"><button id="pzHead" type="button"></button><div id="pzLog" aria-live="polite"></div><div id="pzForm"><input id="pz" maxlength="40" placeholder="한 줄로 말해요" autocomplete="off" enterkeyhint="send"><button class="primary" id="pzSend" type="button" style="white-space:nowrap">보내기</button><div class="muted" id="pzE"></div></div></div>
   <div class="coach" id="coach" style="display:none"></div>
   <div class="coach notice" id="notice" style="display:none"></div>
   <div class="sr-btns" id="srBtns"></div>
  </div>
  
 </div>
</div>
<div class="backdrop" id="backdrop"><aside class="panel" id="panel" role="dialog" aria-modal="true" aria-live="polite"></aside></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script src="vendor/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"><\/script>')</script>
<script src="js/api.js"></script>
<script src="js/room.js"></script>
<script src="js/room-search.js"></script>
<script src="js/room-panels.js"></script>
<script src="js/room-actions.js"></script>
<script src="js/room-timer.js"></script>
<script src="js/village.js"></script>
<script src="js/shared-room.js"></script>
<script src="js/shared-chat.js"></script>
<script src="js/shared-chat-actions.js"></script>
<script src="js/shared-create.js"></script>
<script src="js/shared-actions.js"></script>
<script src="js/neighbor.js"></script>
<script src="js/scene.js"></script>
<script src="js/base.js"></script>
<script src="js/state.js"></script>
<script src="js/stage.js"></script>
<script src="js/render.js"></script>
<script src="js/panel.js"></script>
<script src="js/account.js"></script>
<script src="js/books.js"></script>
<script src="js/sessions.js"></script>
<script src="js/calendar.js"></script>
<script src="js/plaza.js"></script>
<script src="js/app.js"></script>
</body>
</html>
