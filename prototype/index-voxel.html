<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 방 프로토타입 · 독서 공유방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e5da;--card:#fffaf0;--ink:#3b3226;--muted:#8a7d6a;--line:#ddd2bd;--accent:#4f7a5a;--warm:#d9895a;--danger:#b5453a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
button:hover{background:#f6eedd}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#436a4d}
button.ghost{border-color:transparent;background:transparent}
input,textarea{font:inherit;color:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{resize:vertical;min-height:70px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
.app{max-width:1180px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.avatar-dot{width:40px;height:40px;border-radius:50%;background:#e4efe2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.who{flex:1;min-width:0}
.who b{font-size:16px}
.who small{display:block;color:var(--muted);font-size:13px}
.reset{font-size:12px;color:var(--muted);padding:6px 10px}
.main{margin-top:14px}
.stage-wrap{flex:1;min-width:0;position:relative;background:#efe9da;border:1px solid var(--line);border-radius:16px;overflow:hidden}
#stage{width:100%;height:auto;max-height:calc(100vh - 120px);display:block;margin:0 auto;transition:transform .5s ease;touch-action:manipulation}
#stage.zoom{transform:scale(1.55)}
.hint{position:absolute;left:14px;top:12px;font-size:13px;color:var(--muted);background:rgba(255,250,240,.85);padding:4px 10px;border-radius:999px}
.coach{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:3}
.notice{top:auto;bottom:14px;background:#5a4a2e}
.coach button{white-space:nowrap;flex:none;padding:4px 10px;font-size:13px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:50;display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(40,30,20,.28);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.backdrop.open{display:flex;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
aside.panel{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:min(84vh,720px);overflow:auto;box-shadow:0 18px 50px rgba(40,30,20,.25);animation:pop .18s ease}
.foot{position:sticky;bottom:0;background:var(--card);padding:10px 16px 16px;margin-left:-16px;margin-right:-16px;z-index:5;box-shadow:0 -10px 12px -10px rgba(40,30,20,.18)}
.panel-head{position:sticky;top:0;background:var(--card);padding:16px 16px 6px;margin:0 -16px;z-index:5}
aside.panel{padding-top:0!important;padding-bottom:0!important}
aside.panel::after{content:'';display:block;height:16px}
aside.panel.wide{width:min(780px,100%)}
.mir{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.mir-l{display:flex;flex-direction:column;gap:10px;position:sticky;top:64px}
.mir-pv{background:#eef4f3;border-radius:14px;display:flex;align-items:center;justify-content:center;height:320px}
.shuffle{width:48px;height:48px;padding:0;border-radius:50%;align-self:center;display:flex;align-items:center;justify-content:center}
.mir-r .opt{margin-bottom:16px}.mir-r .opt:last-child{margin-bottom:0}
.mir-r .opt label{margin:0 0 8px}
.mir-r .row.wrap{gap:8px}
@media (max-width:640px){.mir{grid-template-columns:1fr;gap:16px}.mir-l{position:static}.mir-pv{height:210px}.mir-pv svg{height:190px}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.panel-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.panel-head h2{flex:1;margin:0;font-size:19px;font-weight:normal}
.handle{display:none}
.firsttip{font-size:13px;background:#f3ead4;border-radius:10px;padding:8px 10px;margin:6px 0 10px;color:#6b5b3e}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin:8px 0}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px;margin-top:4px;min-height:1px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1;padding:7px}
.seg button.on{background:var(--ink);color:#fff}
.note{border-left:3px solid var(--accent);padding:6px 10px;margin:8px 0;background:#fbf7ee;border-radius:0 8px 8px 0;font-size:14px}
.note.q{border-color:var(--warm);font-style:italic}
.note .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px;font-style:normal}
.stars button{border:0;background:transparent;font-size:24px;padding:0 2px;color:#d6c9ad}
.stars button.on{color:#e0a43a}
.book{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px;margin:7px 0;background:#fff;width:100%;text-align:left}
.spine{width:12px;height:42px;border-radius:3px;flex:none}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{padding:6px 12px;border-radius:999px;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:#e4efe2;color:#2f5a3a}
.badge.warn{background:#fbe7d6;color:#9a4b1c}
.badge.gray{background:#eee8dc;color:#6b5f4c}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.preset{padding:6px 10px;font-size:13px}
.preset.on{background:var(--ink);color:#fff}
.acc{font-size:13px;padding:6px 10px}
.acc.on{background:var(--ink);color:#fff}
.acc[disabled]{opacity:.5;cursor:not-allowed}
.progress{height:8px;background:#eee4cf;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.msg{font-size:14px;margin:6px 0}
.msg b{font-weight:normal;color:var(--muted);font-size:12px;margin-right:6px}
.sr-btns button{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
.furn{cursor:pointer}
.furn .hull{fill:transparent;stroke:transparent;stroke-width:4;stroke-linejoin:round}
.furn.hl .hull{stroke:#fff6d8}
.furn.hl .shape{filter:brightness(1.06)}
@media (hover:hover){.furn:hover .hull{stroke:#fff6d8}.furn:hover .shape{filter:brightness(1.06)}}
input[type=range]{accent-color:var(--accent)}
.home-f{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:6px 0;padding:9px 10px}
.home-f i{font-style:normal;width:22px;text-align:center}
.furn.dim{opacity:.35}
.pulse{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.flash{animation:fl .5s ease 2}
@keyframes fl{50%{filter:brightness(1.35)}}
.spark{animation:tw 1.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
@media (max-width:760px){
 .app{padding:10px}
 .main{display:block}
 .stage-wrap{display:flex;align-items:center;min-height:calc(100vh - 100px);min-height:calc(100dvh - 100px)}
 #stage{max-height:none}
 .coach{width:calc(100% - 24px);justify-content:space-between}
 .toast{max-width:90%;text-align:center}
 .who small{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.pulse,.spark,.flash{animation:none}#stage{transition:none}}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="avatar-dot" id="hdrAvatar" aria-hidden="true"></div>
  <div class="who"><b id="hdrName">조약돌의 방</b><small id="hdrStats"></small></div>
  <button class="reset" id="resetBtn">데모 초기화</button>
 </header>
 <div class="main">
  <div class="stage-wrap" id="stageWrap">
   <svg id="stage" viewBox="-290 -200 640 520" role="img" aria-label="내 방"></svg>
   <div class="hint" id="hint">가구를 눌러 사용 · 바닥을 눌러 이동</div>
   <div class="coach" id="coach" style="display:none"></div>
   <div class="coach notice" id="notice" style="display:none"></div>
   <div class="sr-btns" id="srBtns"></div>
  </div>
  
 </div>
</div>
<div class="backdrop" id="backdrop"><aside class="panel" id="panel" role="dialog" aria-modal="true" aria-live="polite"></aside></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script>
let TW=32,TZ=32;const TH=16;
const P=(x,y,z)=>[(x-y)*TW,(x+y)*TH-z*TZ];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.min(255,Math.round(r*f));g=Math.min(255,Math.round(g*f));b=Math.min(255,Math.round(b*f));return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function box(x,y,z,w,d,h,c,cls){
 const t=[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)];
 const r=[P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)];
 const l=[P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)];
 const k=cls?` class="${cls}"`:'';
 return `<g${k}><polygon points="${pts(l)}" fill="${shade(c,.9)}"/><polygon points="${pts(r)}" fill="${shade(c,.78)}"/><polygon points="${pts(t)}" fill="${c}"/></g>`;
}
function hull(x,y,z,w,d,h){return `<polygon class="hull" points="${pts([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y,z),P(x+w,y+d,z),P(x,y+d,z),P(x,y+d,z+h)])}"/>`}
function floorPoly(x1,y1,x2,y2,fill,extra=''){return `<polygon points="${pts([P(x1,y1,0.01),P(x2,y1,0.01),P(x2,y2,0.01),P(x1,y2,0.01)])}" fill="${fill}" ${extra}/>`}
function wallRect(x1,x2,z1,z2,fill,y=0.02){return `<polygon points="${pts([P(x1,y,z1),P(x2,y,z1),P(x2,y,z2),P(x1,y,z2)])}" fill="${fill}"/>`}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return (d.getMonth()+1)+'.'+String(d.getDate()).padStart(2,'0')};

const PRESETS={책벌레:{style:'short',hair:'#4a2e1c',top:'#4f7a5a',bottom:'#2f3540',skin:'#e8b98f'},산책러:{style:'ponytail',hair:'#2b2b2b',top:'#c96f4a',bottom:'#5b6b7f',skin:'#d9a57c'},겨울:{style:'bob',hair:'#7a4b2a',top:'#e9e2d0',bottom:'#3d4a3a',skin:'#f0c9a3'},캠퍼스:{style:'pigtails',hair:'#c49a5a',top:'#5a78a8',bottom:'#d8cdb5',skin:'#e8b98f'}};
const STYLES=[['short','기본'],['bob','단발'],['pigtails','양갈래'],['ponytail','포니테일'],['bald','대머리']];
const SW={hair:['#2b2b2b','#4a2e1c','#7a4b2a','#c49a5a','#8b8f98'],top:['#4f7a5a','#c96f4a','#5a78a8','#e9e2d0','#8a5a8f','#d8b04a'],bottom:['#2f3540','#5b6b7f','#3d4a3a','#d8cdb5','#6b4a3a'],skin:['#f0c9a3','#e8b98f','#d9a57c','#b07a52']};
const SPINE=['#6d8f6b','#b9654a','#d7b45a','#5f7aa0','#8c5a7a','#a8875a','#4f6d6a','#c98a6a'];

function defaultState(){return{
 user:{nickname:'조약돌',handle:'pebble'},streak:7,
 reading:null,
 finished:[
  {id:1,title:'아몬드',author:'손원평',rating:4,review:'감정을 배워가는 이야기라 오래 남았다',finishedAt:'10.12',notes:[{type:'QUOTE',content:'누구도 무엇도 탓하지 않았다.',page:88,at:'10.08'},{type:'MEMO',content:'윤재가 곤이를 이해하는 장면에서 멈춰서 생각함',page:150,at:'10.10'}],rooms:[{title:'『아몬드』 같이 읽기',period:'10.13 ~ 10.20',messages:[{who:'나',text:'결말에서 엄마 장면이 제일 기억에 남았어요'},{who:'참여자 A',text:'저는 곤이 시점으로 다시 읽어보고 싶어졌어요'},{who:'참여자 B',text:'감정을 모른다는 설정이 오히려 감정을 더 크게 느끼게 했던 것 같아요'}]}]},
  {id:2,title:'불편한 편의점',author:'김호연',rating:3,review:'',finishedAt:'10.25',notes:[],rooms:[]},
  {id:3,title:'어린 왕자',author:'생텍쥐페리',rating:5,review:'볼 때마다 다른 문장이 보인다',finishedAt:'11.01',notes:[{type:'QUOTE',content:'가장 중요한 것은 눈에 보이지 않아.',page:92,at:'11.01'}],rooms:[]},
  {id:4,title:'사피엔스',author:'유발 하라리',rating:4,review:'',finishedAt:'11.06',notes:[],rooms:[]},
  {id:5,title:'채식주의자',author:'한강',rating:4,review:'',finishedAt:'11.11',notes:[],rooms:[]}
 ],
 dropped:[],
 avatar:{...PRESETS['책벌레'],acc:'none',preset:'책벌레'},
 unlocked:{glasses:true},newItem:true,session:null,sessions:[],
 onboard:1,seen:{},
 news:[
  {id:'n1',kind:'OPEN',title:'『작별하지 않는다』 같이 읽기',sub:'오늘 22:00 종료 · 12명 참여 중'},
  {id:'n2',kind:'SOON',title:'『소년이 온다』 이야기방',sub:'11.20 개방',alarm:false},
  {id:'n3',kind:'CLOSED',title:'『불편한 편의점』 이야기방',sub:'가져오기 마감 D-2',book:'불편한 편의점',author:'김호연',done:false,period:'11.03 ~ 11.10',messages:[{who:'나',text:'독고 씨가 변해가는 과정이 좋았어요'},{who:'참여자 A',text:'편의점이라는 공간이 하나의 동네처럼 느껴졌어요'}]},
  {id:'n4',kind:'CLOSED',title:'『모순』 이야기방',sub:'가져오기 마감 D-5',book:'모순',author:'양귀자',done:false,period:'11.06 ~ 11.13',messages:[{who:'나',text:'안진진의 선택이 이해되면서도 아팠어요'},{who:'참여자 A',text:'제목이 끝까지 읽어야 이해되는 책이었어요'}]}
 ]
}}
let S;
try{S=JSON.parse(localStorage.getItem('myroom-proto-v1'))}catch(e){}
if(!S)S=defaultState();
if(!S.sessions)S.sessions=[];if(S.session===undefined)S.session=null;if(S.reading&&!S.reading.id)S.reading.id=Date.now();
const save=()=>{try{localStorage.setItem('myroom-proto-v1',JSON.stringify(S))}catch(e){}};

let char;
let tempAvatar=null;
let panelOpen=null, panelView={};
let walkAnim=null;
const svg=document.getElementById('stage');
const avatarNow=()=>tempAvatar||S.avatar;

// 레이아웃: wide=데스크톱 10×8 방, tall=모바일 7×6.5 방 + 세운 카메라(TW↓). 가구는 d만큼 평행이동.
const BASE_T={sofa:[6.4,4.7],lamp:[5.3,6.9],mirror:[6.5,1.25],window:[3.6,1.5],door:[9,1.1]};
const LAY={
 wide:{tw:32,tz:32,X:10,Y:8,vb:'-290 -200 640 520',d:{win:[0,0],mir:[0,0],door:[0,0],sofa:[0,0]},shelfEnd:6.8,K:14,shelf:[1.7,3.8],start:[7.6,6.2]},
 tall:{tw:24,tz:28,X:7,Y:6.5,vb:'-182 -160 368 398',d:{win:[-1.2,0],mir:[-2.05,0],door:[-2.8,0],sofa:[-0.9,-1.2]},shelfEnd:5.9,K:12,shelf:[1.7,3.0],start:[5.6,5.2]}
};
let L,TARGET,SIT,STAND;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
function setLayout(n){L=LAY[n];TW=L.tw;TZ=L.tz;const d=L.d;
 TARGET={sofa:add(BASE_T.sofa,d.sofa),lamp:add(BASE_T.lamp,d.sofa),shelf:L.shelf,mirror:add(BASE_T.mirror,d.mir),window:add(BASE_T.window,d.win),door:add(BASE_T.door,d.door)};
 STAND=TARGET.sofa;SIT=add([5.0,4.7],d.sofa);svg.setAttribute('viewBox',L.vb);char={x:L.start[0],y:L.start[1],face:1}}
const mv=(d,s)=>{const [a,b]=P(d[0],d[1],0);return a||b?`<g transform="translate(${a} ${b})">${s}</g>`:s};
const flat=fn=>{const o=[TW,TZ];TW=32;TZ=32;try{return fn()}finally{[TW,TZ]=o}};
const MQ=matchMedia('(max-width:760px)');
const useLayout=()=>setLayout(MQ.matches?'tall':'wide');
useLayout();
MQ.addEventListener('change',()=>{cancelAnimationFrame(walkAnim);useLayout();render()});

function charSVG(cx,cy,a,face,label=true,pose='stand',dz=0,bookCol=null){
 let s='';let hb=1.7;
 if(pose==='sit'){
  face=1;const hz=0.73+dz;hb=hz+0.88;
  s+=box(cx+0.62,cy-0.14,Math.max(0,hz-0.73),0.2,0.28,0.73,shade(a.bottom,.92));
  s+=box(cx-0.1,cy-0.14,hz,0.8,0.28,0.24,a.bottom);
  s+=box(cx-0.3,cy-0.2,hz,0.5,0.4,0.88,a.top);
 }else{
  s+=`<ellipse cx="${P(cx,cy,0)[0]}" cy="${P(cx,cy,0)[1]}" rx="${TW*.625}" ry="9" fill="rgba(60,40,20,.18)"/>`;
  s+=box(cx-0.24,cy-0.14,0,0.48,0.28,0.85,a.bottom);
  s+=box(cx-0.3,cy-0.2,0.85,0.6,0.4,0.85,a.top);
 }
 const st=a.style||'short';
 const H=(u,v,z,du,dv,dh,c=a.hair)=>face>0?box(cx+u,cy+v,z,du,dv,dh,c):box(cx+v,cy+u,z,dv,du,dh,c);
 let pre='',post='';

function sitDown(){
 cancelAnimationFrame(walkAnim);
 char.pose='sit';char.face=1;const sx=char.x,t0=performance.now();
 const step=now=>{const t=Math.min(1,(now-t0)/320);char.x=sx+(SIT[0]-sx)*t;char.y=SIT[1];char.dz=Math.sin(Math.PI*t)*0.35;render();if(t<1)walkAnim=requestAnimationFrame(step);else{char.dz=0;render()}};
 walkAnim=requestAnimationFrame(step);
}
function walkTo(tx,ty,done){
 cancelAnimationFrame(walkAnim);
 if(char.pose==='sit'){char.pose='stand';char.dz=0;char.x=STAND[0];char.y=STAND[1]}
 const sx=char.x,sy=char.y,dist=Math.hypot(tx-sx,ty-sy),dur=Math.max(150,dist/5*1000),t0=performance.now();
 char.face=(tx-sx)-(ty-sy)>=0?1:-1;
 const step=now=>{const t=Math.min(1,(now-t0)/dur);char.x=sx+(tx-sx)*t;char.y=sy+(ty-sy)*t;render();if(t<1)walkAnim=requestAnimationFrame(step);else done&&done()};
 walkAnim=requestAnimationFrame(step);
}

 const st=ses?(ses.status==='RUNNING'?`스탠드 켜짐 · <span id="homeT">${fmtHMS(elapsed())}</span>`:'스탠드 확인 필요'):'스탠드 꺼짐';
 const F=[['sofa','🛋','소파','지금 읽는 책 · 메모'],['lamp','💡','스탠드','독서 타이머'],['shelf','📚','책장','다 읽은 책 '+S.finished.length+'권'],['mirror','🪞','거울','캐릭터 꾸미기'],['window','🪟','창문','마을 소식'],['door','🚪','문','마을로 나가기']];
 return `<div class="panel-head"><h2>오늘의 방</h2></div>
  <div class="card">${r?`<b>『${esc(r.title)}』</b> 읽는 중<div class="progress" style="margin:8px 0 6px"><i style="width:${r.progress}%"></i></div><div class="muted">${r.progress}% · ${st}</div>`:'<b>소파가 비어 있어요</b><div class="muted" style="margin-top:4px">읽을 책을 올려두면 스탠드를 켤 수 있어요</div>'}
  <div class="muted" style="margin-top:6px">오늘 ${todayMin()}분 · ${S.streak}일 연속</div></div>
  <label>가구</label>${F.map(([k,ic,n,d])=>`<button class="home-f" data-act="home" data-f="${k}"><i>${ic}</i><span class="grow">${n}</span><span class="muted">${d}</span></button>`).join('')}
  <p class="muted" style="margin-top:10px">방 안의 가구를 눌러도 돼요. 바닥을 누르면 캐릭터가 걸어가요.</p>`;
}
function sofaPanel(){
 const r=S.reading;
 if(!r){return head('소파 · 읽을 책 올리기')+`<p class="muted">지금 읽는 책 한 권만 올릴 수 있어요.</p>
  <label for="bt">제목</label><input id="bt" placeholder="데미안" value="${esc(panelView.t||'')}"><div class="err" id="btE"></div>
  <label for="ba">저자</label><input id="ba" placeholder="헤르만 헤세" value="${esc(panelView.a||'')}"><div class="err" id="baE"></div>
  <div class="foot" style="margin-top:14px"><button class="primary" data-act="addBook" style="width:100%">소파에 두기</button></div>`}
 if(panelView.mode==='finish'){const st=panelView.rating||0;
  return head('완독했어요')+`<div class="card"><b>『${esc(r.title)}』</b><div class="muted">${esc(r.author)} · 메모 ${r.notes.length}개</div></div>
  <label>별점 (선택)</label><div class="stars">${[1,2,3,4,5].map(n=>`<button data-act="star" data-n="${n}" class="${n<=st?'on':''}" aria-label="${n}점">★</button>`).join('')}</div>
  <label for="rv">한줄평 (선택)</label><input id="rv" placeholder="오래 남을 것 같은 책" value="${esc(panelView.review||'')}">
  <div class="row foot" style="margin-top:14px"><button data-act="cancelFinish">뒤로</button><button class="primary grow" data-act="doFinish">책장에 꽂기</button></div>`}
 if(panelView.mode==='drop'){return head('그만 읽을까요?')+`<p>『${esc(r.title)}』을 소파에서 내려요. 남긴 메모 ${r.notes.length}개는 책장의 ‘중단한 책’에 그대로 보관돼요.</p>
  <div class="row"><button class="grow" data-act="cancelFinish">계속 읽기</button><button class="grow" data-act="doDrop" style="color:var(--danger)">그만 읽기</button></div>`}

  <div class="row foot" style="margin-top:10px"><div class="progress grow"><i style="width:${r.progress}%"></i></div><span class="muted" id="pv">${r.progress}%</span></div>
  <input type="range" min="0" max="100" step="5" value="${r.progress}" id="prog" aria-label="진행률" style="padding:0;border:0;margin-top:8px"></div>
  <label>오늘 읽은 부분 남기기</label>
  <div class="seg"><button data-act="type" data-t="MEMO" class="${type==='MEMO'?'on':''}">메모</button><button data-act="type" data-t="QUOTE" class="${type==='QUOTE'?'on':''}">인용구</button></div>
  <textarea id="nc" style="margin-top:8px" placeholder="${type==='QUOTE'?'마음에 남은 문장을 그대로 적어요':'읽으면서 든 생각을 적어요'}">${esc(panelView.draft||'')}</textarea>
  <div class="err" id="ncE"></div>
  <div class="row" style="margin-top:6px"><input id="np" type="number" min="1" placeholder="쪽 (선택)" style="width:110px"><button class="primary grow" data-act="addNote">추가</button></div>
  <div style="margin-top:10px">${r.notes.length?r.notes.slice().reverse().map((n,ix)=>noteHTML(n,r.notes.length-1-ix,true)).join(''):'<p class="muted">아직 남긴 기록이 없어요.</p>'}</div>

function noteHTML(n,ix,del){return `<div class="note ${n.type==='QUOTE'?'q':''}">${n.type==='QUOTE'?'“'+esc(n.content)+'”':esc(n.content)}<div class="meta"><span>${n.type==='QUOTE'?'인용구':'메모'}${n.page?' · '+n.page+'쪽':''} · ${n.at}</span>${del?`<button class="ghost" style="padding:0 4px;font-size:12px" data-act="delNote" data-i="${ix}">삭제</button>`:''}</div></div>`}
function lampPanel(){
 const r=S.reading,ses=S.session,v=panelView;
 const tools=`<details style="margin-top:14px"><summary class="muted" style="cursor:pointer">테스트 도구 (시간 앞당기기)</summary><div class="row wrap" style="margin-top:8px"><button data-act="ff" data-m="10">+10분</button><button data-act="ff" data-m="60">+60분 · 확인 알림</button><button data-act="ff" data-m="185">+3시간 · 깜빡함</button></div><p class="muted">실제로는 서버의 시작 시각을 기준으로 계산해요. 여기서는 시작 시각을 과거로 옮겨서 흉내 내요.</p></details>`;
 if(ses&&ses.status==='NEEDS_CONFIRM'){
  const lastOk=ses.lastCheckAt-ses.startedAt>=60000;const lm=Math.round((ses.lastCheckAt-ses.startedAt)/60000);
  if(v.mode==='cmanual')return head('스탠드 · 언제까지 읽었나요?')+`<label for="cm">읽은 시간 (분)</label><input id="cm" type="number" min="1" max="600" placeholder="45"><div class="err" id="cmE"></div><div class="row foot" style="margin-top:12px"><button data-act="back2">뒤로</button><button class="primary grow" data-act="confirmManual">저장</button></div>`;
  return head('스탠드 · 확인이 필요해요')+`<div class="card"><b>${fmtClock(ses.startedAt)}에 켠 스탠드가 아직 켜져 있어요.</b><div class="muted" style="margin-top:4px">3시간이 넘어서 기록을 잠시 멈췄어요. 언제까지 읽었나요?</div></div>
   ${lastOk?`<button class="primary" style="width:100%;margin-top:6px" data-act="confirmLast">마지막으로 '계속'을 누른 ${fmtClock(ses.lastCheckAt)}까지 · ${lm}분</button>`:`<button class="primary" style="width:100%;margin-top:6px" data-act="confirmHour">1시간 읽은 걸로 기록</button>`}
   <div class="row" style="margin-top:8px"><button class="grow" data-act="cmanual">직접 입력</button><button class="grow" data-act="discard" style="color:var(--danger)">기록 안 함</button></div>`;
 }
 if(!r)return head('스탠드 · 꺼짐')+`<p>소파에 책을 올리면 스탠드를 켤 수 있어요.</p><button class="primary" data-act="goSofa" style="width:100%">소파로 가기</button>`;
 const bookMin=minOfBook(r.id);
 if(ses){
  if(v.mode==='stop'){const pr=v.prog??r.progress;
   return head('읽기 끝')+`<div class="card"><div class="muted">이번에 읽은 시간</div><div style="font-size:28px">${fmtHMS(elapsed())}</div><div class="muted">${fmtClock(ses.startedAt)} ~ 지금 · 『${esc(r.title)}』</div></div>
   <label for="sp">어디까지 읽었나요?</label><div class="row"><input type="range" id="sp" min="0" max="100" step="5" value="${pr}" style="padding:0;border:0" class="grow"><span class="muted" id="spv">${pr}%</span></div>
   <label for="sm">한 줄 메모 (선택)</label><input id="sm" placeholder="오늘 읽은 부분에서 남기고 싶은 것" value="${esc(v.memo||'')}">
   <div class="row foot" style="margin-top:14px"><button data-act="back2">계속 읽기</button><button class="primary grow" data-act="stopSave">끄고 저장</button></div>`}
  return head('스탠드 · 켜짐')+`<div class="card" style="text-align:center"><div class="muted">『${esc(r.title)}』 읽는 중</div><div id="timerBig" style="font-size:40px;letter-spacing:1px;margin:4px 0">${fmtHMS(elapsed())}</div><div class="muted">${fmtClock(ses.startedAt)}에 켰어요 · 이 책 누적 ${bookMin}분</div></div>
   <p class="muted">화면을 꺼도, 앱을 닫아도 계속 기록돼요. 다시 열면 켠 시각부터 다시 계산해요.</p>
   <div class="row"><button class="primary grow" data-act="stopAsk">💡 스탠드 끄기</button>${pipOK()?`<button class="grow" data-act="pip">바탕화면에 띄우기</button>`:''}</div>${pipOK()?'':'<p class="muted" style="margin-top:6px">바탕화면 띄우기는 데스크톱 크롬·엣지·파이어폭스 151 이상에서 돼요.</p>'}
   <button class="ghost" style="width:100%;margin-top:6px;color:var(--danger)" data-act="discard">기록 안 하고 끄기</button>${tools}`;
 }
 if(v.mode==='manual')return head('직접 기록')+`<p class="muted">스탠드를 못 켜고 밖에서 읽었을 때 쓰세요.</p>
   <label>언제</label><div class="seg"><button data-act="mday" data-d="0" class="${(v.day||0)==0?'on':''}">오늘</button><button data-act="mday" data-d="1" class="${v.day==1?'on':''}">어제</button></div>
   <label for="mm">읽은 시간 (분)</label><input id="mm" type="number" min="1" max="600" placeholder="30"><div class="err" id="mmE"></div>
   <div class="row foot" style="margin-top:12px"><button data-act="back2">뒤로</button><button class="primary grow" data-act="manualSave">기록하기</button></div>`;
 const recent=S.sessions.filter(x=>x.bookId===r.id).sort((p,q)=>q.startedAt-p.startedAt).slice(0,5);
 return head('스탠드 · 꺼짐')+`<div class="card"><b>『${esc(r.title)}』</b><div class="muted" style="margin-top:4px">이 책 누적 ${bookMin}분 · 오늘 ${todayMin()}분</div></div>
  <button class="primary" style="width:100%" data-act="startTimer">스탠드 켜고 읽기 시작</button>
  <button style="width:100%;margin-top:6px" data-act="manual">밖에서 읽었어요 · 직접 기록</button>
  <label>최근 기록</label>${recent.length?recent.map(x=>`<div class="row" style="font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)"><span class="grow">${fmtDay(x.startedAt)} ${x.source==='MANUAL'?'직접 기록':fmtClock(x.startedAt)+' ~ '+fmtClock(x.endedAt)}</span><b style="font-weight:normal">${x.minutes}분</b></div>`).join(''):'<p class="muted">아직 기록이 없어요.</p>'}`;
}
function shelfPanel(){
 const v=panelView;
 if(v.book!=null){const list=v.drop?S.dropped:S.finished;const b=list.find(x=>x.id===v.book);if(!b){panelView={};return shelfPanel()}
  const tab=v.tab||'notes';const tabs=[['notes','기록 '+b.notes.length],['review','한줄평']].concat(b.rooms&&b.rooms.length?[['rooms','공유방 '+b.rooms.length]]:[]);
  let body='';
  if(tab==='notes')body=b.notes.length?b.notes.map(n=>noteHTML(n)).join(''):'<p class="muted">남긴 메모가 없어요.</p>';
  if(tab==='review')body=`<div class="card">${b.rating?`<div style="color:#e0a43a">${'★'.repeat(b.rating)}<span style="color:#d6c9ad">${'★'.repeat(5-b.rating)}</span></div>`:''}<div>${b.review?esc(b.review):'<span class="muted">한줄평이 없어요.</span>'}</div></div>`;
  if(tab==='rooms')body=b.rooms.map(rm=>`<div class="card"><b>${esc(rm.title)}</b><div class="muted">${rm.period} · 가져온 기록</div><div style="margin-top:8px">${rm.messages.map(m=>`<div class="msg"><b>${esc(m.who)}</b>${esc(m.text)}</div>`).join('')}</div></div>`).join('')+'<p class="muted">다른 참여자 이름은 익명으로 보관돼요.</p>';
  return head('책장')+`<button class="ghost" data-act="back" style="padding:4px 0">← 목록</button>
   <div class="row" style="margin-top:6px"><div class="spine" style="background:${bookColor(b.title)}"></div><div><b>『${esc(b.title)}』</b><div class="muted">${esc(b.author)} · ${v.drop?'중단':b.finishedAt+' 완독'}</div></div></div>
   <div class="tabs">${tabs.map(([k,l])=>`<button data-act="tab" data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>${body}`}
 const showDrop=v.list==='drop';
 const list=showDrop?S.dropped:S.finished.slice().reverse();
 return head('책장')+`<div class="tabs"><button data-act="list" data-t="done" class="${!showDrop?'on':''}">다 읽은 책 ${S.finished.length}</button><button data-act="list" data-t="drop" class="${showDrop?'on':''}">중단한 책 ${S.dropped.length}</button></div>
  ${list.length?list.map(b=>`<button class="book" data-act="openBook" data-id="${b.id}" data-drop="${showDrop?1:0}"><div class="spine" style="background:${bookColor(b.title)}"></div><div class="grow"><div>『${esc(b.title)}』</div><div class="muted">${esc(b.author)}${b.rating?' · '+'★'.repeat(b.rating):''}</div></div>${b.rooms&&b.rooms.length?'<span class="badge">공유방</span>':''}</button>`).join(''):'<p class="muted">아직 없어요.</p>'}`;
}
function mirrorPanel(){
 const a=tempAvatar;const fc=S.finished.length;const st=a.style||'short';
 const opt=(lab,inner)=>`<div class="opt"><label>${lab}</label><div class="row wrap">${inner}</div></div>`;
 const sw=(k,lab)=>opt(lab,SW[k].map(c=>`<button class="sw ${a[k]===c?'on':''}" style="background:${c}" data-act="sw" data-k="${k}" data-c="${c}" aria-label="${lab} 색"></button>`).join(''));
 return head('전신거울')+`<div class="mir"><div class="mir-l"><div class="mir-pv"><svg viewBox="-42 -104 84 120" width="210" height="290" role="img" aria-label="캐릭터 미리보기">${flat(()=>charSVG(0,0,a,1,false))}</svg></div>
   <button class="shuffle" data-act="shuffle" aria-label="셔플" title="셔플"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button></div>
  <div class="mir-r">
  ${opt('머리 스타일',STYLES.map(([k,n])=>`<button class="preset ${st===k?'on':''}" data-act="style" data-s="${k}">${n}</button>`).join(''))}
  ${sw('hair','머리색')}${sw('skin','피부')}${sw('top','상의')}${sw('bottom','하의')}
  ${opt('액세서리',`<button class="acc ${a.acc==='none'?'on':''}" data-act="acc" data-a="none">없음</button>
   <button class="acc ${a.acc==='glasses'?'on':''}" data-act="acc" data-a="glasses">동그란 안경 <span class="badge warn">NEW</span></button>
   <button class="acc ${a.acc==='beanie'?'on':''}" data-act="acc" data-a="beanie" ${fc>=10?'':'disabled'}>비니 ${fc>=10?'':'· 10권 읽으면'}</button>`)}
  </div></div>
  <div class="row foot" style="margin-top:16px"><button data-act="cancelMirror" class="grow">취소</button><button class="primary grow" data-act="saveMirror">저장</button></div>`;
}
function windowPanel(){
 const K={OPEN:['진행 중',''],SOON:['예정','gray'],CLOSED:['종료','warn']};
 return head('창문 · 마을 소식')+S.news.map(n=>{const [l,c]=K[n.kind];let act='';
  if(n.kind==='OPEN')act=`<button data-act="goVillage">마을로 가기</button>`;
  if(n.kind==='SOON')act=`<button data-act="alarm" data-id="${n.id}">${n.alarm?'알림 받는 중 ✓':'알림 받기'}</button>`;
  if(n.kind==='CLOSED')act=n.done?`<span class="muted">내 서재로 가져옴 ✓</span>`:`<button class="primary" data-act="import" data-id="${n.id}">내 서재로 가져오기</button>`;
  return `<div class="card"><div class="row"><span class="badge ${c}">${l}</span><b class="grow" style="font-weight:normal">${esc(n.title)}</b></div><div class="muted" style="margin:6px 0 8px">${n.sub}</div>${act}</div>`}).join('')+'<p class="muted">공유방 기록은 종료 후 7일 동안만 보관돼요.</p>';
}
function cancelMirror(){tempAvatar=null;zoom(false);render()}

panel.addEventListener('input',e=>{
 if(e.target.id==='prog'){S.reading.progress=+e.target.value;document.getElementById('pv').textContent=e.target.value+'%';e.target.previousElementSibling;save();const bar=panel.querySelector('.progress i');if(bar)bar.style.width=e.target.value+'%';render()}
 if(e.target.id==='nc'){panelView.draft=e.target.value;document.getElementById('ncE').textContent=''}
 if(e.target.id==='bt'){panelView.t=e.target.value;document.getElementById('btE').textContent=''}
 if(e.target.id==='ba'){panelView.a=e.target.value;document.getElementById('baE').textContent=''}
 if(e.target.id==='rv'){panelView.review=e.target.value}
 if(e.target.id==='sp'){panelView.prog=+e.target.value;document.getElementById('spv').textContent=e.target.value+'%'}
 if(e.target.id==='sm'){panelView.memo=e.target.value}
});
panel.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
 if(act==='close')return closePanel();
 if(act==='home'){openF(b.dataset.f);return}
 if(act==='handle')return panel.classList.toggle('full');
 if(act==='addBook'){const t=(panelView.t||'').trim(),a=(panelView.a||'').trim();let bad=false;
  if(!t){document.getElementById('btE').textContent='제목을 입력해 주세요';bad=true}
  if(!a){document.getElementById('baE').textContent='저자를 입력해 주세요';bad=true}
  if(bad)return;
  S.reading={id:Date.now(),title:t,author:a,progress:0,notes:[],startedAt:today()};panelView={};
  const wasOb=S.onboard===1;if(wasOb)S.onboard=2;save();render();renderPanel();toast('소파에 『'+t+'』을 올렸어요');return}
 if(act==='type'){panelView.type=b.dataset.t;renderPanel();return}
 if(act==='addNote'){const c=(panelView.draft||'').trim();if(!c){document.getElementById('ncE').textContent='내용을 입력해 주세요';return}
  const pg=+document.getElementById('np').value||null;S.reading.notes.push({type:panelView.type||'MEMO',content:c,page:pg,at:today()});panelView.draft='';save();renderPanel();return}
 if(act==='delNote'){S.reading.notes.splice(+b.dataset.i,1);save();renderPanel();return}
 if(act==='finish'){panelView.mode='finish';renderPanel();return}
 if(act==='drop'){panelView.mode='drop';renderPanel();return}
 if(act==='cancelFinish'){panelView.mode=null;renderPanel();return}
 if(act==='star'){panelView.rating=+b.dataset.n===panelView.rating?0:+b.dataset.n;renderPanel();return}
 if(act==='doFinish'){if(S.session)endSession(Date.now(),'FINISH',true);const r=S.reading;const id=r.id||Date.now();S.finished.push({id,title:r.title,author:r.author,rating:panelView.rating||0,review:(panelView.review||'').trim(),finishedAt:today(),notes:r.notes,rooms:[]});
  S.reading=null;panelView={};save();closePanel();render();const g=document.getElementById('g-shelf');if(g)g.classList.add('flash');toast('『'+r.title+'』을 책장에 꽂았어요');return}
 if(act==='doDrop'){if(S.session)endSession(Date.now(),'FINISH',true);const r=S.reading;S.dropped.push({id:r.id||Date.now(),title:r.title,author:r.author,rating:0,review:'',finishedAt:today(),notes:r.notes,rooms:[]});S.reading=null;panelView={};save();closePanel();render();toast('소파를 비웠어요');return}
 if(act==='goSofa'){openF('sofa');return}
 if(act==='startTimer'){startTimer();return}
 if(act==='pip'){openPip();return}
 if(act==='stopAsk'){panelView={mode:'stop'};renderPanel();return}
 if(act==='back2'){panelView={};renderPanel();return}
 if(act==='stopSave'){const r=S.reading;if(panelView.prog!=null)r.progress=panelView.prog;const m=(panelView.memo||'').trim();if(m)r.notes.push({type:'MEMO',content:m,page:null,at:today()});endSession(Date.now(),'LAMP');return}
 if(act==='discard'){if(pipWin)pipDone(0);S.session=null;save();panelView={};render();renderPanel();toast('기록하지 않고 스탠드를 껐어요');return}
 if(act==='ff'){const ms=+b.dataset.m*60000;S.session.startedAt-=ms;S.session.lastCheckAt-=ms;if(+b.dataset.m>=180)S.session.lastCheckAt=S.session.startedAt+70*60000;save();checkSession(true);return}
 if(act==='confirmLast'){endSession(S.session.lastCheckAt,'CONFIRM');return}
 if(act==='confirmHour'){endSession(S.session.startedAt+3600000,'CONFIRM');return}
 if(act==='cmanual'){panelView={mode:'cmanual'};renderPanel();return}
 if(act==='confirmManual'){const m=+document.getElementById('cm').value;if(!(m>=1&&m<=600)){document.getElementById('cmE').textContent='1~600분 사이로 입력해 주세요';return}endSession(S.session.startedAt+m*60000,'CONFIRM');return}
 if(act==='manual'){panelView={mode:'manual',day:0};renderPanel();return}
 if(act==='mday'){panelView.day=+b.dataset.d;renderPanel();return}
 if(act==='manualSave'){const m=+document.getElementById('mm').value;if(!(m>=1&&m<=600)){document.getElementById('mmE').textContent='1~600분 사이로 입력해 주세요';return}
  const d=new Date();d.setDate(d.getDate()-(panelView.day||0));d.setHours(12,0,0,0);S.sessions.push({id:Date.now(),bookId:S.reading.id,startedAt:d.getTime(),endedAt:d.getTime()+m*60000,minutes:m,source:'MANUAL',endedBy:'MANUAL'});save();panelView={};render();renderPanel();toast(m+'분을 기록했어요');return}
 if(act==='list'){panelView={list:b.dataset.t};renderPanel();return}
 if(act==='openBook'){panelView={book:+b.dataset.id,drop:b.dataset.drop==='1',list:panelView.list};renderPanel();return}
 if(act==='back'){panelView={list:panelView.list};renderPanel();return}
 if(act==='tab'){panelView.tab=b.dataset.t;renderPanel();return}
 if(act==='preset'){tempAvatar={...tempAvatar,...PRESETS[b.dataset.p],preset:b.dataset.p};renderPanel();render();return}
 if(act==='shuffle'){const pk=x=>x[Math.floor(Math.random()*x.length)];const accs=['none','glasses'].concat(S.finished.length>=10?['beanie']:[]);tempAvatar={...tempAvatar,style:pk(STYLES)[0],hair:pk(SW.hair),skin:pk(SW.skin),top:pk(SW.top),bottom:pk(SW.bottom),acc:pk(accs),preset:null};renderPanel();render();return}
 if(act==='style'){tempAvatar.style=b.dataset.s;tempAvatar.preset=null;renderPanel();render();return}
 if(act==='sw'){tempAvatar[b.dataset.k]=b.dataset.c;tempAvatar.preset=null;renderPanel();render();return}
 if(act==='acc'){if(b.disabled)return;tempAvatar.acc=b.dataset.a;renderPanel();render();return}
 if(act==='cancelMirror'){closePanel();return}
 if(act==='saveMirror'){S.avatar={...tempAvatar};tempAvatar=null;save();panelOpen=null;closePanel();render();toast('새 모습을 저장했어요');return}
 if(act==='goVillage'){closePanel();openF('door');return}
 if(act==='alarm'){const n=S.news.find(x=>x.id===b.dataset.id);n.alarm=!n.alarm;save();renderPanel();if(n.alarm)toast('개방되면 알려드릴게요');return}
 if(act==='import'){const n=S.news.find(x=>x.id===b.dataset.id);let bk=S.finished.find(x=>x.title===n.book);let created=false;
  if(!bk){bk={id:Date.now(),title:n.book,author:n.author,rating:0,review:'',finishedAt:today(),notes:[],rooms:[]};S.finished.push(bk);created=true}
  bk.rooms.push({title:n.title,period:n.period,messages:n.messages});n.done=true;save();render();renderPanel();
  toast(created?'책장에 『'+n.book+'』이 새로 꽂히고 공유방 탭이 생겼어요':'『'+n.book+'』에 공유방 탭이 생겼어요');return}
});
document.getElementById('resetBtn').onclick=()=>{try{localStorage.removeItem('myroom-proto-v1')}catch(e){}S=defaultState();char={x:L.start[0],y:L.start[1],face:1};tempAvatar=null;closePanel();render();toast('처음 상태로 되돌렸어요');entryFlash()};

function entryFlash(){
 if(!window.matchMedia('(hover: none)').matches)return;
 ORDER.forEach((f,i)=>setTimeout(()=>{hl(f,true);setTimeout(()=>hl(f,false),350)},300+i*180));
}
const CAP=3*3600000,CHECK=3600000;
let pipWin=null;
function pipOK(){return 'documentPictureInPicture' in window}
function pipScene(on=true){return flat(()=>pipScene0(on))}
function pipScene0(on){
 const a=S.avatar,bc=S.reading?bookColor(S.reading.title):'#6d8f6b';
 let g=`<polygon points="${pts(Array.from({length:28},(_,j)=>{const t=j/28*Math.PI*2;return P(4.9+1.6*Math.cos(t),5.2+1.6*Math.sin(t),0)}))}" fill="#ffd46b" opacity="${on?.35:0}" style="transition:opacity .4s"/>`;
 g+=box(4,3.8,0,1.8,1.8,0.55,'#c9784c')+box(4,3.8,0.55,0.45,1.8,0.95,'#c9784c')+box(4.45,3.8,0.55,1.35,0.35,0.42,'#d48555')+box(4.45,4.15,0.55,1.3,1.1,0.18,'#e39a68');
 g+=charSVG(5.0,4.7,a,1,false,'sit',0,bc);
 g+=box(4.45,5.25,0.55,1.35,0.35,0.42,'#d48555');
 const [gx,gy]=P(4.43,6.23,2.55);
 g+=`<g id="plamp" style="cursor:pointer">${hull(4.0,5.8,0,0.9,0.9,3.3)}`+(on?`<ellipse cx="${gx}" cy="${gy}" rx="26" ry="12" fill="#ffe08a" opacity=".5"/>`:'')+box(4.25,6.05,0,0.36,0.36,0.08,'#6b5a48')+box(4.4,6.2,0.08,0.06,0.06,2.6,'#6b5a48')+box(4.15,5.95,2.6,0.56,0.56,0.55,on?'#ffd46b':'#e9dcc0')+`</g>`;
 return `<svg viewBox="-105 45 210 150" width="100%" style="display:block">${g}</svg>`;
}
async function openPip(){
 if(!pipOK()){toast('이 브라우저는 바탕화면 띄우기를 지원하지 않아요');return}
 if(pipWin){pipWin.focus();return}
 try{pipWin=await documentPictureInPicture.requestWindow({width:240,height:250})}
 catch(e){toast('이 화면에서는 띄울 수 없어요. 파일로 열어서 크롬에서 해보세요');return}
 const d=pipWin.document;
 d.title='읽는 중';
 d.body.innerHTML=`<style>body{margin:0;background:#efe9da;font-family:"Gowun Dodum",system-ui,sans-serif;color:#3b3226;display:flex;flex-direction:column;height:100vh}
 #plamp .hull{fill:transparent;stroke:transparent;stroke-width:3}#plamp:hover .hull{stroke:#fff6d8}#plamp:hover{filter:brightness(1.08)}
 .t{font-size:26px;text-align:center;letter-spacing:1px}.b{display:flex;gap:6px;padding:0 10px 10px}
 button{flex:1;font:inherit;border:0;border-radius:10px;padding:8px;background:#4f7a5a;color:#fff;cursor:pointer;font-size:15px}
 .s{font-size:12px;text-align:center;color:#8a7d6a;margin-top:-2px}</style>
 <div id="scene" style="flex:1;min-height:0">${pipScene()}</div>
 <div class="t" id="pt">${fmtHMS(elapsed())}</div><div class="s" id="ps">『${esc(S.reading?S.reading.title:'')}』</div>
 <div class="s" id="ph" style="margin:2px 0 10px">스탠드를 누르면 끝나요</div>`;
 d.getElementById('plamp').addEventListener('click',()=>{if(!(S.session&&S.session.status==='RUNNING'))return;
  const sc=d.getElementById('scene');if(sc)sc.innerHTML=pipScene(false);setTimeout(()=>endSession(Date.now(),'PIP'),450)});
 pipWin.addEventListener('pagehide',()=>{pipWin=null});
}
function pipDone(min){
 const w=pipWin;if(!w)return;const d=w.document;
 const t=d.getElementById('pt'),s=d.getElementById('ps'),h=d.getElementById('ph'),sc=d.getElementById('scene');
 if(sc)sc.innerHTML=pipScene(false);
 if(t)t.textContent=min>=1?min+'분 기록':'기록 안 함';if(s)s.textContent='스탠드를 껐어요';if(h)h.textContent='';
 setTimeout(()=>{try{w.close()}catch(e){}},1800);
}
function elapsed(){return S.session?Date.now()-S.session.startedAt:0}
function fmtHMS(ms){const t=Math.max(0,Math.floor(ms/1000));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')}
function fmtClock(e){const d=new Date(e);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtDay(e){const d=new Date(e);return (d.getMonth()+1)+'.'+String(d.getDate()).padStart(2,'0')}
function minOfBook(id){return S.sessions.filter(x=>x.bookId===id).reduce((a,x)=>a+x.minutes,0)}
function todayMin(){const t=new Date().toDateString();return S.sessions.filter(x=>new Date(x.startedAt).toDateString()===t).reduce((a,x)=>a+x.minutes,0)}
function startTimer(){
 if(!S.reading||S.session)return;
 const now=Date.now();S.session={id:now,bookId:S.reading.id,startedAt:now,lastCheckAt:now,status:'RUNNING'};save();
 panelView={};render();renderPanel();toast('스탠드를 켰어요. 읽기 시작!');
 if(char.pose!=='sit')walkTo(...TARGET.sofa,sitDown);
}
function endSession(end,by,quiet){
 if(pipWin){const mm=S.session?Math.round((end-S.session.startedAt)/60000):0;pipDone(mm);}
 const ses=S.session;if(!ses)return;const min=Math.round((end-ses.startedAt)/60000);S.session=null;
 if(min<1){if(!quiet)toast('1분 미만은 기록하지 않아요')}
 else{S.sessions.push({id:ses.id,bookId:ses.bookId,startedAt:ses.startedAt,endedAt:end,minutes:min,source:'TIMER',endedBy:by});if(!quiet)toast(min+'분 읽었어요. 스탠드를 껐어요')}
 save();panelView={};render();renderPanel();
}
function checkSession(force){
 const ses=S.session;if(!ses)return;
 if(ses.status==='RUNNING'&&Date.now()-ses.startedAt>CAP){ses.status='NEEDS_CONFIRM';save();render();if(panelOpen==='lamp')renderPanel();return}
 if(force){render();if(panelOpen==='lamp'||!panelOpen)renderPanel()}
}
function renderNotice(){
 const n=document.getElementById('notice');const ses=S.session;
 if(ses&&ses.status==='NEEDS_CONFIRM'){n.style.display='flex';n.innerHTML=`<span>${fmtClock(ses.startedAt)}에 켠 스탠드가 아직 켜져 있어요</span><button data-n="confirm">확인하기</button>`}
 else if(ses&&Date.now()-ses.lastCheckAt>=CHECK){n.style.display='flex';n.innerHTML=`<span>아직 읽고 있어요? <small style="opacity:.7">(알림 예시)</small></span><button data-n="cont">계속</button><button data-n="stop">스탠드 끄기</button>`}
 else n.style.display='none';
}
document.getElementById('notice').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;e.stopPropagation();
 if(b.dataset.n==='cont'){S.session.lastCheckAt=Date.now();save();render();toast('계속 기록할게요')}
 if(b.dataset.n==='stop'){openF('lamp');panelView={mode:'stop'};renderPanel()}
 if(b.dataset.n==='confirm'){openF('lamp')}
});
setInterval(()=>{if(!S.session)return;if(pipWin){const el=pipWin.document.getElementById('pt');if(el)el.textContent=fmtHMS(elapsed())}checkSession();if(S.session&&S.session.status==='RUNNING'){const t=fmtHMS(elapsed());const a=document.getElementById('lampTime');if(a)a.textContent=t;const big=document.getElementById('timerBig');if(big)big.textContent=t;const ht=document.getElementById('homeT');if(ht)ht.textContent=t;
 document.getElementById('hdrStats').textContent='@'+S.user.handle+' · 읽은 책 '+S.finished.length+'권 · '+S.streak+'일 연속 기록 · 오늘 '+todayMin()+'분 · ⏱ '+t;
 const n=document.getElementById('notice');if(n.style.display==='none'&&Date.now()-S.session.lastCheckAt>=CHECK)renderNotice()}},1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkSession(true)});
render();renderPanel();entryFlash();checkSession(true);
</script>
</body>
