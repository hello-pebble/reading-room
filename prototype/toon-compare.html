<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>툰 셰이딩 비교 · 독서 공유방</title>
<style>
:root{--ink:#3b3226;--muted:#8a7d68;--bg:#efe6d4;--card:#fffaf0;--line:#e2d6bc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1e8d6;--muted:#b9ad97;--bg:#2a241c;--card:#3a3228;--line:#51473a}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:18px;font-weight:normal;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:280px}
figcaption{padding:8px 12px 10px;font-size:13px}
figcaption b{font-weight:normal;font-size:15px;display:block}
.muted{color:var(--muted)}
label{display:inline-flex;gap:6px;align-items:center;margin-top:6px;font-size:13px}
p{margin:10px 2px}
</style></head><body><main>
<h1>같은 장면을 두 가지 셰이딩으로 비교</h1>
<div class="grid">
 <figure><canvas id="a"></canvas><figcaption><b>지금: 소프트 3D</b><span class="muted">부드러운 빛 계산(PBR), 그림자, 원목 질감이 자연스럽게 섞임</span></figcaption></figure>
 <figure><canvas id="b"></canvas><figcaption><b>툰 셰이딩</b><span class="muted">빛을 3단계로 끊어 칠하고 외곽선을 두름</span><br><label><input type="checkbox" id="ol" checked> 외곽선</label> <label><input type="checkbox" id="st" checked> 3단 음영 (끄면 2단)</label></figcaption></figure>
</div>
<p class="muted">작은 비교용 장면입니다(유령, 원목 바닥, 모닥불, 나무, 집). 실제 서비스 화면은 바뀌지 않았습니다.</p>
</main>
<script src="vendor/three.min.js"></script>
<script>
const toonRamp=n=>{const d=n===3?[150,205,255]:[170,255,255];const t=new THREE.DataTexture(new Uint8Array(d.flatMap(v=>[v,v,v,255])),d.length,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t};
const woodTex=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
 for(let i=0;i<8;i++){x.fillStyle=['#e0b074','#d9a867','#e6b87c','#dcab6c'][i%4];x.fillRect(0,i*32,256,32);x.fillStyle='rgba(120,70,20,.35)';x.fillRect(0,i*32,256,2)}
 for(let i=0;i<60;i++){x.strokeStyle='rgba(140,90,40,.18)';x.beginPath();const y=Math.random()*256;x.moveTo(0,y);x.lineTo(256,y+Math.random()*4-2);x.stroke()}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t};

function makeScene(mode){
 const toon=mode==='toon',scene=new THREE.Scene(),ramp=toonRamp(3);
 const mat=(color,o={})=>toon?new THREE.MeshToonMaterial({color,gradientMap:ramp,...(o.map?{map:o.map}:{}),...(o.side?{side:o.side}:{})}):new THREE.MeshStandardMaterial({color,roughness:o.r??.6,...(o.map?{map:o.map}:{}),...(o.side?{side:o.side}:{})});
 const basic=c=>new THREE.MeshBasicMaterial({color:c});
 const add=(g,m,p=[0,0,0],s=[1,1,1],r=[0,0,0],noOutline)=>{const k=new THREE.Mesh(g,m);k.position.set(...p);k.scale.set(...s);k.rotation.set(...r);k.castShadow=true;k.receiveShadow=true;if(noOutline)k.userData.noOutline=true;scene.add(k);return k};
 const sph=r=>new THREE.SphereGeometry(r,28,18);
 // 바닥
 const fl=add(new THREE.BoxGeometry(8,.3,8),mat('#ffffff',{map:woodTex()}),[4,-.15,4],[1,1,1],[0,0,0],true);fl.castShadow=false;
 // 유령
 const prof=[[.84,.3],[.8,.42],[.72,.7],[.64,.98],[.58,1.22],[.56,1.46],[.58,1.7],[.54,1.92],[.42,2.1],[.24,2.22],[0,2.25]].map(([r,y])=>new THREE.Vector2(r,y));
 const ghost=new THREE.Group();ghost.position.set(4.6,.1,4.8);ghost.rotation.y=.9;scene.add(ghost);scene.userData.ghost=ghost;
 const g=new THREE.LatheGeometry(prof,64);const body=new THREE.Mesh(g,mat('#f6f3ff',{side:THREE.DoubleSide}));body.castShadow=body.receiveShadow=true;ghost.add(body);
 const ink=mat('#2a2438'),dot=x=>{const e=new THREE.Mesh(sph(.07),ink);e.scale.set(.9,1.3,.6);e.position.set(x*.2,1.72,.6);e.userData.noOutline=true;ghost.add(e)};dot(1);dot(-1);
 [1,-1].forEach(s=>{const c=new THREE.Mesh(sph(.11),basic('#ff9fb0'));c.scale.set(1,.7,.35);c.position.set(s*.32,1.62,.58);c.userData.noOutline=true;ghost.add(c)});
 const hm=mat('#e0dcf2');[[-.27,1.25,.5],[.27,1.25,.5]].forEach(p=>{const h=new THREE.Mesh(sph(.12),hm);h.position.set(...p);h.castShadow=true;ghost.add(h)});
 // 모닥불
 const st=mat('#9a958a'),lg=mat('#4a3322');
 for(let k=0;k<9;k++){const a=k/9*Math.PI*2;add(new THREE.BoxGeometry(.24,.18,.22),st,[5.8+Math.cos(a)*.5,.09,2.4+Math.sin(a)*.5],[1,1,1],[0,-a,0])}
 add(new THREE.BoxGeometry(.7,.1,.14),lg,[5.8,.16,2.4],[1,1,1],[0,.5,0]);add(new THREE.BoxGeometry(.7,.1,.14),lg,[5.8,.16,2.4],[1,1,1],[0,-.5,0]);
 add(new THREE.ConeGeometry(.3,.9,14),basic('#ff8a3d'),[5.8,.62,2.4],[1,1,1],[0,0,0],true).castShadow=false;
 add(new THREE.ConeGeometry(.18,.6,14),basic('#ffd45a'),[5.8,.5,2.4],[1,1,1],[0,0,0],true).castShadow=false;
 // 나무
 [[1.4,5.6,1.1],[2.6,6.5,.8]].forEach(([x,z,s])=>{add(new THREE.CylinderGeometry(.08*s,.11*s,.8*s,10),mat('#7a5536'),[x,.4*s,z]);add(sph(.55*s),mat('#e0892f'),[x,1.05*s,z])});
 // 집
 const hx=2.0,hz=2.0;add(new THREE.BoxGeometry(1.8,1.5,1.6),mat('#d8b27a'),[hx,.75,hz]);
 add(new THREE.ConeGeometry(1.4,1.0,4),mat('#b5653a'),[hx,2.0,hz],[1,1,1],[0,Math.PI/4,0]);
 add(new THREE.BoxGeometry(.34,.4,.05),basic('#ffd66b'),[hx-.4,.9,hz+.82],[1,1,1],[0,0,0],true);
 // 조명
 scene.add(new THREE.HemisphereLight(0xffffff,0xb9a98c,toon?1.1:.66));
 const sun=new THREE.DirectionalLight(0xfff2dc,toon?.9:.5);sun.position.set(9,14,6);sun.castShadow=true;
 Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0005;sun.shadow.normalBias=.03;scene.add(sun);
 // 외곽선 (뒤집은 껍데기를 법선 방향으로 부풀림)
 const outlines=[];
 if(toon){const om=new THREE.MeshBasicMaterial({color:'#3b2a1a',side:THREE.BackSide});
  om.onBeforeCompile=s=>{s.vertexShader=s.vertexShader.replace('#include <begin_vertex>','vec3 transformed=position+normalize(normal)*0.05;')};
  const list=[];scene.traverse(o=>{if(o.isMesh&&!o.userData.noOutline)list.push(o)});
  list.forEach(m=>{const o=new THREE.Mesh(m.geometry,om);o.userData.noOutline=true;m.add(o);outlines.push(o)})}
 return {scene,outlines,ramp,mats:null};
}
function view(id,mode){
 const cv=document.getElementById(id),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setClearColor(0xf3e9d2);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.setPixelRatio(Math.min(devicePixelRatio,2));
 const S=makeScene(mode),cam=new THREE.OrthographicCamera(-5,5,5,-5,.1,100),dir=new THREE.Vector3(1,.82,1).normalize(),T=new THREE.Vector3(4,1,4);
 cam.position.copy(T).addScaledVector(dir,40);cam.lookAt(T);
 const fit=()=>{const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);const a=w/h,vh=Math.max(8.4,9.6/a);cam.left=-vh*a/2;cam.right=vh*a/2;cam.top=vh/2;cam.bottom=-vh/2;cam.updateProjectionMatrix()};
 fit();addEventListener('resize',fit);
 return {S,R,cam,cv};
}
const A=view('a','std'),B=view('b','toon');
document.getElementById('ol').onchange=e=>B.S.outlines.forEach(o=>o.visible=e.target.checked);
document.getElementById('st').onchange=e=>{const n=e.target.checked?3:2,t=toonRamp(n);B.S.scene.traverse(o=>{if(o.isMesh&&o.material.isMeshToonMaterial){o.material.gradientMap=t;o.material.needsUpdate=true}})};
const t0=performance.now();
(function loop(){requestAnimationFrame(loop);const t=(performance.now()-t0)/1000;[A,B].forEach(v=>{const g=v.S.scene.userData.ghost;g.position.y=.1+Math.sin(t*2.2)*.04;g.rotation.y=.9+Math.sin(t*.8)*.25;v.R.render(v.S.scene,v.cam)})})();
</script></body></html>
