# 테스트 배포용: 서버(화면 포함) + PostgreSQL. 키는 .env 또는 셸 환경변수로 준다(저장소에 넣지 않는다).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: readingroom
      POSTGRES_USER: readingroom
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 정해 주세요}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readingroom"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/readingroom
      DATABASE_USER: readingroom
      DATABASE_PASSWORD: ${DB_PASSWORD}
      NL_CERT_KEY: ${NL_CERT_KEY:-}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
      FORWARD_HEADERS: ${FORWARD_HEADERS:-none}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
volumes:
  pgdata:
